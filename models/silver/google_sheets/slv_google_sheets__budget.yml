models:
  - name: slv_google_sheets__budget
    description: Presupuesto de Silver.
    columns:
      - name: budget_id
        description: Identificador de fila de la hoja (_row en origen).
        data_tests: 
          - not_null
          - unique
      - name: product_id
        description: Identificador del producto
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_sql_server_dbo__products')
                field: product_id
      - name: quantity_budgeted
        description: Cantidad presupuestada
        data_tests:
          - not_null
          - positive_values
      - name: budget_month
        description: Mes del presupuesto, casteado a date.
        data_tests:
          - not_null
      - name: date_load
        description: Fecha de carga
        data_tests:
          - not_null